# Versión de iPhone: la compila un Mac de GitHub (no hace falta tener Mac).
# Resultado: RetroStation-iOS.ipa sin firmar, en "Artifacts" de cada
# ejecución. Se instala con SideStore/AltStore/Sideloadly, que la firman con
# tu Apple ID. No incluye juegos comerciales (solo el homebrew de bundled.json).
name: iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Los emuladores de la versión de iPhone, completos; del resto solo hace
      # falta su licencia (la app las muestra en Ajustes > Licencias), así que se
      # descargan sin historial de archivos (más rápido).
      - name: Emuladores (submódulos)
        run: |
          git submodule update --init \
            native/third_party/mgba native/third_party/fceumm native/third_party/snes9x \
            native/third_party/pcsx_rearmed native/third_party/melonds native/third_party/gpsp \
            native/third_party/genesis_plus_gx native/third_party/mupen64plus
          git submodule update --init --filter=blob:none native/third_party/desmume2015
          # PSP: PPSSPP con sus propios submódulos (glslang, SPIRV-Cross, rcheevos...).
          git submodule update --init native/third_party/ppsspp
          git -C native/third_party/ppsspp submodule update --init --recursive --filter=blob:none
          # 3DS: Azahar con todos sus submódulos (boost, dynarmic, glslang...).
          git submodule update --init --filter=blob:none native/third_party/azahar
          git -C native/third_party/azahar submodule update --init --recursive --depth 1             || git -C native/third_party/azahar submodule update --init --recursive

      - name: Herramientas
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          # El Xcode más reciente del Mac: los plugins de Flutter usan APIs de iOS 26.
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          # Vulkan para la 3DS: MoltenVK ya compilado (Khronos).
          mkdir -p "$RUNNER_TEMP/moltenvk"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/moltenvk/mvk.tar"             https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          tar xf "$RUNNER_TEMP/moltenvk/mvk.tar" -C "$RUNNER_TEMP/moltenvk"
          echo "MOLTENVK_DIR=$RUNNER_TEMP/moltenvk" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Motor y emuladores para iPhone
        run: bash tool/build_ios_native.sh

      - name: App (sin firmar)
        run: |
          flutter pub get
          set +e
          flutter build ios --release --no-codesign --verbose > build-ios.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "::group::Errores de Xcode"
            grep -nE "error:|\\*\\* BUILD FAILED|Command .* failed|ld: |clang: error" build-ios.log | head -80
            echo "::endgroup::"
            tail -40 build-ios.log
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: registro-xcode
          path: build-ios.log
          retention-days: 7

      - name: Empaquetar .ipa
        run: |
          app=build/ios/iphoneos/Runner.app
          mkdir -p "$app/Frameworks" "$app/sfx"
          cp -R build/ios-frameworks/*.framework "$app/Frameworks/"
          cp android/app/src/main/res/raw/sfx_*.wav "$app/sfx/"
          rm -rf Payload && mkdir Payload
          cp -R "$app" Payload/
          zip -qry RetroStation-iOS.ipa Payload
          ls -lh RetroStation-iOS.ipa
          ls "$app/Frameworks"

      - uses: actions/upload-artifact@v4
        with:
          name: RetroStation-iOS
          path: RetroStation-iOS.ipa
          retention-days: 30
